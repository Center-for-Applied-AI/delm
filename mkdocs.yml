site_name: DELM Documentation
site_description: Documentation for the DELM (Data Extraction with Language Models) toolkit.
repo_url: https://github.com/Center-for-Applied-AI/delm
repo_name: Center-for-Applied-AI/delm
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  logo: assets/delm_logo.png

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.insert(0, "src")
          paths:
            - src
          options:
            show_root_heading: true
            show_object_full_path: false
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            heading_level: 2
            members_order: alphabetical

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Tutorials:
      - Cost Estimation: tutorials/cost-estimation.md
      - Performance Evaluation: tutorials/performance-evaluation.md
  - Configuration:
      - Pipeline Configuration: configuration/pipeline-config.md
      - Schema Design: configuration/schema-design.md
  - Features:
      - Caching: features/caching.md
      - Text Processing: features/text-processing.md
      - Batch Processing: features/batch-processing.md
      - Checkpointing: features/checkpointing.md
      - Cost Tracking: features/cost-tracking.md
      - Post-Processing: features/post-processing.md
      - File Formats: features/file-formats.md
  - Reference:
      - API Overview: reference/index.md
      - Pipeline API: reference/pipeline.md
      - Configuration Objects: reference/config.md
      - Core Managers: reference/managers.md
      - Utilities: reference/utilities.md
