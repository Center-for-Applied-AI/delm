site_name: DELM Documentation
site_description: Documentation for the DELM (Data Extraction with Language Models) toolkit.
repo_url: https://github.com/Center-for-Applied-AI/delm
repo_name: Center-for-Applied-AI/delm
edit_uri: ""

theme:
  name: material
  logo: assets/delm_logo.png
  features:
    - navigation.footer
    - content.code.copy
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.insert(0, "src")
          paths:
            - src
          options:
            show_root_heading: true
            show_object_full_path: false
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            heading_level: 2
            members_order: alphabetical

nav:
  - Overview: index.md
  - Getting Started: getting-started.md

  - User Guide:
      - Defining Schemas: user-guide/schemas.md
      - Customizing Prompts: user-guide/prompt-customization.md
      - Loading Data: user-guide/input-data.md
      - Preprocessing Text: user-guide/text-preprocessing.md
      - Cost Management: user-guide/cost-management.md
      - Caching: user-guide/caching.md
      - Evaluation: user-guide/evaluation.md
      - Output Data: user-guide/output-data.md

  - Advanced:
      - Large Jobs & Checkpointing: advanced/large-jobs.md
      - Configuration Files: advanced/config-files.md
      - Logging & Debugging: advanced/logging.md
      - Two-Stage Processing: advanced/two-stage.md

  - Reference:
      - API Overview: reference/index.md
      - DELM: reference/delm.md
      - Schema: reference/schema.md
      - ExtractionVariable: reference/extraction-variable.md
      - DELMConfig: reference/config.md
      - Cost Estimation: reference/cost-estimation.md
      - Performance Evaluation: reference/performance-evaluation.md
      - Post-Processing: reference/post-processing.md
      - Splitting Strategies: reference/splitting-strategies.md
      - Relevance Scorers: reference/relevance-scorers.md
      - System Constants: reference/constants.md
