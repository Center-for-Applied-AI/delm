llm_extraction:
  provider: "openai"
  name: "gpt-4o-mini"
  temperature: 0.0
  max_retries: 3
  batch_size: 10
  max_workers: 10
  base_delay: 1.0
  track_cost: true
  max_budget: 50.0
  dotenv_path: ".env"

data_preprocessing:
  target_column: "text"
  drop_target_column: false
  pandas_score_filter: "delm_score > 0"
  splitting:
    type: "ParagraphSplit"
  scoring:
    type: "KeywordScorer"
    keywords: ["price", "cost", "market", "commodity", "oil", "gas", "steel", "copper", "aluminum", "gold"]

schema:
  spec_path: "commodity_schema.yaml"
  container_name: "commodity_prices"
  prompt_template: |
    Extract all numeric market prices for goods mentioned by firm representatives in investor call transcripts. For each, record: good, subtype (if needed), whether it's a price expectation, price bounds, unit, currency, and time horizon.

    {variables}

    {text}

semantic_cache:
  backend: "sqlite"
  path: "./cache"
  max_size_mb: 100
  synchronous: "normal"
